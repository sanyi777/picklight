<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾光头像 UI</title>
  <style>
    :root {
      --ink: #202733;
      --muted: #6f7b8a;
      --line: #dce4ec;
      --wash: #f5f8fb;
      --card: #ffffff;
      --blue: #4a90d9;
      --blue-deep: #2f72b4;
      --green: #19a99a;
      --yellow: #df9c2f;
      --shadow: 0 20px 54px rgba(42, 63, 88, .16);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        linear-gradient(115deg, rgba(74, 144, 217, .16), rgba(25, 169, 154, .08) 52%, rgba(223, 156, 47, .10)),
        #edf3f8;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .stage {
      width: min(1040px, 100%);
      display: grid;
      grid-template-columns: minmax(360px, .9fr) minmax(420px, 1.1fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .92);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .profile-panel {
      min-height: 560px;
      padding: 22px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 22px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(38px, 6vw, 72px);
      line-height: .92;
      letter-spacing: 0;
      font-family: Georgia, "Times New Roman", "Songti SC", serif;
      font-weight: 700;
    }

    .avatar-zone {
      display: grid;
      place-items: center;
      padding: 26px 0;
    }

    .avatar {
      width: 220px;
      aspect-ratio: 1;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 54% 38%, rgba(255, 255, 255, .92) 0 17%, transparent 18%),
        conic-gradient(from -36deg, var(--blue) 0 28%, var(--green) 28% 56%, var(--yellow) 56% 72%, #26384c 72% 100%);
      box-shadow:
        inset 0 0 0 10px rgba(255, 255, 255, .78),
        0 22px 42px rgba(47, 114, 180, .22);
    }

    .avatar::before {
      content: "";
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      background:
        linear-gradient(135deg, transparent 0 38%, rgba(255, 255, 255, .92) 39% 47%, transparent 48%),
        radial-gradient(circle at 52% 48%, #fbfdff 0 47%, #eaf4ff 48% 100%);
      box-shadow: inset 0 0 0 1px rgba(32, 39, 51, .08);
    }

    .avatar::after {
      content: "";
      position: absolute;
      right: 22px;
      bottom: 28px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 6px #fbfdff;
    }

    .avatar-letter {
      z-index: 1;
      font-size: 72px;
      line-height: 1;
      font-family: Georgia, "Times New Roman", "Songti SC", serif;
      color: var(--ink);
    }

    .identity {
      display: grid;
      gap: 10px;
    }

    .identity strong {
      font-size: 22px;
    }

    .identity span {
      color: var(--muted);
      font-size: 14px;
    }

    .identity-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary,
    .secondary {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 750;
    }

    .primary {
      color: #fff;
      background: var(--blue);
      box-shadow: 0 12px 24px rgba(74, 144, 217, .24);
    }

    .secondary {
      color: var(--blue-deep);
      background: #eaf4ff;
    }

    .detail-panel {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .section-head {
      min-height: 62px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .section-head h2 {
      font-size: 18px;
    }

    .section-head span {
      color: var(--muted);
      font-size: 13px;
    }

    .variant-grid {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-content: start;
      background-image:
        linear-gradient(rgba(74, 144, 217, .055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 144, 217, .055) 1px, transparent 1px);
      background-size: 42px 42px;
    }

    .variant {
      min-height: 132px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .86);
      padding: 14px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
    }

    .mini-avatar {
      width: 64px;
      aspect-ratio: 1;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, transparent 0 39%, rgba(255, 255, 255, .9) 40% 50%, transparent 51%),
        conic-gradient(from -30deg, var(--blue) 0 38%, var(--green) 38% 67%, #26384c 67% 100%);
      box-shadow: inset 0 0 0 5px rgba(255, 255, 255, .72);
      font-family: Georgia, "Times New Roman", "Songti SC", serif;
      font-size: 22px;
      font-weight: 700;
    }

    .mini-avatar.local::after,
    .mini-avatar.focus::after,
    .mini-avatar.rest::after,
    .mini-avatar.offline::after {
      content: "";
      position: absolute;
      right: 2px;
      bottom: 4px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      box-shadow: 0 0 0 4px #fff;
    }

    .mini-avatar.local::after {
      background: var(--green);
    }

    .mini-avatar.focus::after {
      background: var(--blue);
    }

    .mini-avatar.rest::after {
      background: var(--yellow);
    }

    .mini-avatar.offline::after {
      background: #9aa8b5;
    }

    .variant-text {
      display: grid;
      gap: 5px;
    }

    .variant-text strong {
      font-size: 15px;
    }

    .variant-text span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .token-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 3px;
    }

    .token {
      min-height: 24px;
      border-radius: 999px;
      padding: 4px 8px;
      background: #eef5fb;
      color: var(--blue-deep);
      font-size: 12px;
      font-weight: 650;
    }

    @media (max-width: 860px) {
      body {
        padding: 18px;
      }

      .stage {
        grid-template-columns: 1fr;
      }

      .profile-panel {
        min-height: auto;
      }

      .variant-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="panel profile-panel" aria-label="头像主样式">
      <div>
        <p class="eyebrow">拾光 · 本地身份</p>
        <h1>头像 UI</h1>
      </div>

      <div class="avatar-zone">
        <div class="avatar" aria-label="拾光头像">
          <span class="avatar-letter">拾</span>
        </div>
      </div>

      <div class="identity">
        <strong>拾光工作台</strong>
        <span>头像不代表账号，而代表这台设备里正在被保护的注意力现场。</span>
        <div class="identity-actions">
          <button class="primary" type="button">设为头像</button>
          <button class="secondary" type="button">换一组状态</button>
        </div>
      </div>
    </section>

    <section class="panel detail-panel" aria-label="头像状态">
      <div class="section-head">
        <h2>状态版本</h2>
        <span>用于主页、侧栏、专注页</span>
      </div>

      <div class="variant-grid">
        <article class="variant">
          <div class="mini-avatar local">拾</div>
          <div class="variant-text">
            <strong>本地在线</strong>
            <span>默认状态，表示数据只保存在本地。</span>
            <div class="token-row"><span class="token">主页</span><span class="token">设置</span></div>
          </div>
        </article>

        <article class="variant">
          <div class="mini-avatar focus">拾</div>
          <div class="variant-text">
            <strong>正在专注</strong>
            <span>进入番茄钟后使用，强调当前注意力已被占用。</span>
            <div class="token-row"><span class="token">专注</span><span class="token">番茄钟</span></div>
          </div>
        </article>

        <article class="variant">
          <div class="mini-avatar rest">拾</div>
          <div class="variant-text">
            <strong>稍后整理</strong>
            <span>零碎内容较多时使用，提醒先收纳、再整理。</span>
            <div class="token-row"><span class="token">零碎</span><span class="token">收纳箱</span></div>
          </div>
        </article>

        <article class="variant">
          <div class="mini-avatar offline">拾</div>
          <div class="variant-text">
            <strong>未同步</strong>
            <span>第一版无账号无云同步，状态表达保持克制。</span>
            <div class="token-row"><span class="token">本地文件</span><span class="token">备份</span></div>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
